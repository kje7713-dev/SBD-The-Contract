name: TheContractApp
options:
  bundleIdPrefix: com.savagesbydesign
  deploymentTarget:
    iOS: 17.0
targets:
  TheContract:
    type: application
    platform: iOS
    sources: [ApplicationBootstrap.swift, ContractAssets.xcassets, LaunchScreen.storyboard, PrivacyInfo.xcprivacy]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.savagesbydesign.thecontract
      PRODUCT_NAME: TheContract
      INFOPLIST_KEY_CFBundleDisplayName: "The Contract"
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
      MARKETING_VERSION: 1.0.0
      SWIFT_VERSION: "5.9"
schemes:
  TheContract:
    build:
      targets:
        TheContract: all
    archive:
      config: Release
