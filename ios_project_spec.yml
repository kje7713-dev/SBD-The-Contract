name: SBDTheContract

options:
  bundleIdPrefix: com.savagesbydesign
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 17.0
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: $(TEAM_ID_VAR)
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

targets:
  ContractApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    
    sources:
      - ApplicationBootstrap.swift
      - ContractAssets.xcassets
      - LaunchInterface.storyboard
      - PrivacyManifest.xcprivacy
    
    info:
      path: AppConfiguration.plist
      properties:
        CFBundleDisplayName: The Contract
        CFBundleIdentifier: com.savagesbydesign.thecontract
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIDeviceFamily: [1]
        UILaunchStoryboardName: LaunchInterface
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    
    settings:
      base:
        PRODUCT_NAME: TheContract
        PRODUCT_BUNDLE_IDENTIFIER: com.savagesbydesign.thecontract
        INFOPLIST_FILE: AppConfiguration.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: $(TEAM_ID_VAR)
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  ContractApp:
    build:
      targets:
        ContractApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
