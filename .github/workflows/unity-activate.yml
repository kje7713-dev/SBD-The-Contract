name: Unity Activation (Generate ALF)

# IMPORTANT: This workflow uses a deprecated action (unity-request-activation-file).
# - Deprecated: December 2023 (v2.2.0 onwards)
# - This version (v2.1.0) is the last working version before deprecation
# - Unity has deprecated manual activation for Personal licenses
# - Recommended: Use manual local activation (see .github/UNITY_ACTIVATION.md)
#
# Migration Path:
# 1. Install Unity Hub locally
# 2. Activate Unity with your license
# 3. Extract the .ulf license file from your system
# 4. Store it as UNITY_LICENSE secret in repository settings
# 5. Remove this workflow file once all team members have migrated
#
# For new projects, follow: https://game.ci/docs/github/activation
#
# This workflow generates an activation file (.alf) for Unity license requests.
# After running this workflow:
# 1. Download the artifact from the workflow run
# 2. Upload the .alf file to https://license.unity3d.com/manual
# 3. Download the returned .ulf file
# 4. Store the .ulf file contents as a repository secret named UNITY_LICENSE

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2.1.0
        with:
          unityVersion: 2022.3.25f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
